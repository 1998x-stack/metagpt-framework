# LLM Configuration
llm:
  provider: openai
  model_name: gpt-4
  temperature: 0.7
  max_tokens: 4096
  api_key: ${OPENAI_API_KEY}

# Logging Configuration
logging:
  level: INFO
  console_output: true
  file_output: true
  log_dir: logs

# Workflow Configuration
workflow:
  max_iterations: 3
  enable_feedback: true
  enable_review: true
  enable_testing: true
  output_dir: output

# Project Configuration
project:
  name: metagpt_project